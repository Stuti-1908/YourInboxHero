name: CI

on: [push, pull_request]

env:
  PYTHON_VERSION: '3.11'
  # frontend/package.json declares engines.node: "^20.19.0 || >=22.12.0"
  # (Vite 8 / oxlint 1.78 both require it) -- CI was pinned to 18, which
  # doesn't satisfy that range and is why oxlint's native binary failed to
  # load here (its 18.x platform build was dropped upstream).
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint (Python + Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint Python
        run: flake8 src tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node deps
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Explicit +psycopg2 to match what's actually installed
      # (requirements.txt has psycopg2-binary, not psycopg v3) and what
      # production uses -- a plain postgresql:// URL makes SQLAlchemy
      # default to the psycopg3 driver, which isn't installed here.
      DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/testdb
      SECRET_KEY: test-secret-key-for-testing-only-min-32-chars-long
      SENDGRID_API_KEY: SG.test
      ENVIRONMENT: test
      REMINDERS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U test && break
            sleep 1
          done

      - name: Run Alembic Migrations
        run: alembic upgrade head

      - name: Run Tests
        run: pytest -q --cov=src --cov-report=xml --cov-fail-under=50

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          # actions/setup-node resolves cache-dependency-path relative to the
          # repo root, not this job's `working-directory: frontend` default
          # -- without this it looked for package-lock.json at the repo
          # root (where it doesn't exist) and failed before npm ci ever ran.
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      # github/codeql-action/upload-sarif needs security-events: write to
      # post results to the repo's Security tab -- GITHUB_TOKEN defaults to
      # read-only for this scope, which is exactly the "Resource not
      # accessible by integration" error this job was failing with.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
