name: Deploy to Azure App Service

on:
  push:
    branches:
      - master

env:
  ACR_NAME: yourinboxheroacr
  APP_NAME: yourinboxhero-app-prod
  RG_NAME: yourinboxhero-rg-prod
  SLOT_NAME: green

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/yourinboxhero:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/yourinboxhero:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/yourinboxhero:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/yourinboxhero:buildcache,mode=max

      - name: Deploy to Azure Web App (Green Slot)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: ${{ env.SLOT_NAME }}
          images: ${{ env.ACR_NAME }}.azurecr.io/yourinboxhero:${{ github.sha }}

      - name: Health Check on Green Slot
        run: |
          sleep 30
          GREEN_URL="https://${{ env.APP_NAME }}-${{ env.SLOT_NAME }}.azurewebsites.net"
          for i in {1..10}; do
            if curl -sf "$GREEN_URL/health/ready" > /dev/null; then
              echo "Green slot healthy"
              exit 0
            fi
            echo "Waiting for green slot... ($i/10)"
            sleep 10
          done
          echo "Green slot health check failed"
          exit 1

      - name: Swap Slots (Green -> Production)
        uses: azure/CLI@v1
        with:
          azcliversion: 2.53.0
          inlineScript: |
            az webapp deployment slot swap \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RG_NAME }} \
              --slot ${{ env.SLOT_NAME }} \
              --target-slot production

      - name: Verify Production Health
        run: |
          sleep 10
          PROD_URL="https://${{ env.APP_NAME }}.azurewebsites.net"
          for i in {1..5}; do
            if curl -sf "$PROD_URL/health/ready" > /dev/null; then
              echo "Production slot healthy after swap"
              exit 0
            fi
            echo "Waiting for production... ($i/5)"
            sleep 10
          done
          echo "Production health check failed after swap"
          exit 1